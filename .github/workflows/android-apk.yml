name: BIGBULLS Android APK
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Install monorepo dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Build BIGBULLS frontend
        run: npm run build --workspace apps/forex-trading-portal
      - name: Install Capacitor Android tooling
        run: npm install --no-save --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
      - name: Generate Android project and sync frontend
        run: |
          npx cap add android
          npx cap sync android
      - name: Install BIGBULLS native updater bridge
        run: |
          mkdir -p android/app/src/main/java/com/bigbulls/globalmarket
          cp android-native/BigbullsUpdaterPlugin.java android/app/src/main/java/com/bigbulls/globalmarket/
          cp android-native/MainActivity.java android/app/src/main/java/com/bigbulls/globalmarket/
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permission = '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />'
          if 'android.permission.REQUEST_INSTALL_PACKAGES' not in s:
              s = s.replace('<application', permission + '\\n    <application', 1)
          p.write_text(s)
          PY
      - name: Set Android version from update manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          cfg = json.loads(Path('app-update.json').read_text())
          gradle = Path('android/app/build.gradle')
          source = gradle.read_text()
          source, code_count = re.subn(r'versionCode\\s+\\d+', f'versionCode {int(cfg["build"])}', source, count=1)
          source, name_count = re.subn(r'''versionName\\s+['"][^'"]+['"]''', f'versionName "{cfg["version"]}"', source, count=1)
          if not code_count or not name_count:
              raise SystemExit('Could not set Android versionCode/versionName')
          gradle.write_text(source)
          print(f'Android version set to {cfg["version"]} ({cfg["build"]})')
          PY
      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BIGBULLS-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish installable APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD_NUMBER=$(python -c "import json; print(json.load(open('app-update.json'))['build'])")
          cp android/app/build/outputs/apk/debug/app-debug.apk BIGBULLS-Android.apk
          gh release create "android-build-${BUILD_NUMBER}" BIGBULLS-Android.apk \\
            --repo "${GITHUB_REPOSITORY}" \\
            --target "${GITHUB_SHA}" \\
            --title "BIGBULLS Android Build ${BUILD_NUMBER}" \\
            --notes "BIGBULLS v$(python -c "import json; print(json.load(open('app-update.json'))['version'])") build ${BUILD_NUMBER}."
