name: BIGBULLS Android APK
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Install monorepo dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Build BIGBULLS frontend
        run: npm run build --workspace apps/forex-trading-portal
      - name: Install Capacitor Android tooling
        run: npm install --no-save --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
      - name: Generate Android project and sync frontend
        run: |
          npx cap add android
          npx cap sync android
      - name: Install BIGBULLS native updater bridge
        run: |
          mkdir -p android/app/src/main/java/com/bigbulls/globalmarket
          cp android-native/BigbullsUpdaterPlugin.java android/app/src/main/java/com/bigbulls/globalmarket/
          cp android-native/MainActivity.java android/app/src/main/java/com/bigbulls/globalmarket/
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permission = '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />'
          if 'android.permission.REQUEST_INSTALL_PACKAGES' not in s:
              s = s.replace('<application', permission + '\n    <application', 1)
          p.write_text(s)
          PY
      - name: Set Android version from update manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          cfg = json.loads(Path('app-update.json').read_text())
          gradle = Path('android/app/build.gradle')
          source = gradle.read_text()
          source, code_count = re.subn(r'versionCode\s+\d+', f'versionCode {int(cfg["build"])}', source, count=1)
          source, name_count = re.subn(r'''versionName\s+['"][^'"]+['"]''', f'versionName "{cfg["version"]}"', source, count=1)
          if not code_count or not name_count:
              raise SystemExit('Could not set Android versionCode/versionName')
          gradle.write_text(source)
          print(f'Android version set to {cfg["version"]} ({cfg["build"]})')
          PY
      - name: Configure permanent Android release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing KEYSTORE_BASE64 secret" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing KEY_ALIAS secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing KEY_PASSWORD secret" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/bigbulls-release.jks
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/build.gradle')
          s = p.read_text()
          if 'signingConfigs {' not in s:
              block = """    signingConfigs {
                  release {
                      storeFile file('bigbulls-release.jks')
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASSWORD')
                  }
              }

          """
              if '    buildTypes {' not in s:
                  raise SystemExit('Could not find Android buildTypes block')
              s = s.replace('    buildTypes {', block + '    buildTypes {', 1)
          if 'signingConfig signingConfigs.release' not in s:
              build_types_at = s.find('buildTypes')
              release_at = s.find('release {', build_types_at)
              if build_types_at < 0 or release_at < 0:
                  raise SystemExit('Could not find release buildType for signing')
              insert_at = release_at + len('release {')
              s = s[:insert_at] + '\n            signingConfig signingConfigs.release' + s[insert_at:]
          p.write_text(s)
          PY
      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BIGBULLS-Android-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish signed APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD_NUMBER=$(python -c "import json; print(json.load(open('app-update.json'))['build'])")
          cp android/app/build/outputs/apk/release/app-release.apk BIGBULLS-Android.apk
          gh release create "android-build-${BUILD_NUMBER}" BIGBULLS-Android.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "BIGBULLS Android Build ${BUILD_NUMBER}" \
            --notes "Signed BIGBULLS v$(python -c "import json; print(json.load(open('app-update.json'))['version'])") build ${BUILD_NUMBER}."
