name: BIGBULLS Android APK
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Install monorepo dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Build BIGBULLS frontend
        run: npm run build --workspace apps/forex-trading-portal
      - name: Install Capacitor Android tooling
        run: npm install --no-save --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
      - name: Generate Android project and sync frontend
        run: |
          npx cap add android
          npx cap sync android
      - name: Set installable Android version
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re
          gradle = Path('android/app/build.gradle')
          source = gradle.read_text()
          build_number = os.environ['GITHUB_RUN_NUMBER']
          source, code_count = re.subn(r'versionCode\s+\d+', f'versionCode {build_number}', source, count=1)
          source, name_count = re.subn(r'''versionName\s+['"][^'"]+['"]''', 'versionName "3.6.0"', source, count=1)
          if not code_count or not name_count:
              raise SystemExit('Could not set Android versionCode/versionName in generated Gradle file')
          gradle.write_text(source)
          print(f'Android version set to 3.6.0 ({build_number})')
          PY
      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BIGBULLS-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish installable APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk BIGBULLS-Android.apk
          gh release create "android-build-${GITHUB_RUN_NUMBER}" BIGBULLS-Android.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "BIGBULLS Android Build ${GITHUB_RUN_NUMBER}" \
            --notes "Installable BIGBULLS Android debug APK built from commit ${GITHUB_SHA}."
