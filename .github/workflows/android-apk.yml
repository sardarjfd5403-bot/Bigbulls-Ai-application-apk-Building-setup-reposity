name: BIGBULLS Android APK
# Rebuild after first-login AppLock watchdog fix
on:
  workflow_dispatch:
  push:
    branches: [main, feature/bigbullsglobal-android-app]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Install monorepo dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Build BIGBULLS frontend
        run: npm run build --workspace apps/forex-trading-portal
      - name: Install Capacitor Android tooling
        run: npm install --no-save --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
      - name: Generate Android project and sync frontend
        run: |
          npx cap add android
          npx cap sync android
      - name: Set Android 7.0 minimum compatibility
        run: |
          test -f android/variables.gradle
          sed -i -E 's/minSdkVersion[[:space:]]*=[[:space:]]*[0-9]+/minSdkVersion = 24/' android/variables.gradle
          grep -qE 'minSdkVersion[[:space:]]*=[[:space:]]*24' android/variables.gradle
      - name: Verify Android minimum SDK
        run: grep -n 'minSdkVersion' android/variables.gradle
      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BIGBULLS-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
